seed: 42
class_names: [LGG,HGG]
image_channels: 4
patch_size: 128
patch_stride: 64
min_tumour_fraction: 0.10
feature_dims: {deep: 512, radiomics: 128, morphometrics: 14, graph: 128}
model: {token_dim: 256, attention_layers: 3, heads: 8, attention_ff: 512, dropout: 0.1, experts: 4}
loss_weights: [1.0, 0.3, 0.1, 0.05, 0.001]
train: {optimizer: AdamW, lr: 0.0003, weight_decay: 0.0001, epochs: 200, warmup: 10, patience: 20, effective_batch_size: 4, ema: 0.999}
evaluation: {folds: 5, calibration_bins: 15, bootstrap_samples: 1000}
