[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "neurotumourai"
version = "0.1.0"
description = "Research implementation of HybridTumourNet for glioma grading"
requires-python = ">=3.10"
dependencies = ["torch>=2.2","numpy>=1.24,<3","scipy>=1.11","scikit-learn>=1.3","scikit-image>=0.22","nibabel>=5.2","SimpleITK>=2.3","pyradiomics>=3.0","matplotlib>=3.7"]
[tool.setuptools.packages.find]
include = ["neurotumourai*"]
